[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crossllm"
version = "0.1.0"
description = "Data contracts and offline tooling for the CrossLLM protocol"
requires-python = ">=3.11"
dependencies = [
  "jsonschema==4.26.0",
  "z3-solver==5.1.0.0; sys_platform == 'win32'",
  "z3-solver==4.15.4.0; sys_platform != 'win32'",
]

[project.scripts]
crossllm = "crossllm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
