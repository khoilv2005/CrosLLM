[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crossllm"
version = "0.1.0"
description = "Data contracts and offline tooling for the CrossLLM protocol"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20"]

[project.scripts]
crossllm = "crossllm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
