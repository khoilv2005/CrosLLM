[profile.default]
src = "contracts"
test = "test"
out = "out"
solc_version = "0.8.16"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/@openzeppelin/contracts/",
    "@arbitrum/nitro-contracts/=lib/@arbitrum/nitro-contracts/"
]
